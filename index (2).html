<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من ازت حامله هستم😂</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 2.2em;
        }
        
        .question {
            font-size: 1.3em;
            color: #555;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .choice-button {
            padding: 20px 30px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
            position: relative;
            overflow: hidden;
        }
        
        .choice-button.no {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }
        
        .choice-button.yes {
            background: linear-gradient(45deg, #51cf66, #40c057);
            color: white;
        }
        
        .choice-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .choice-button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤔 سوال مهم</h1>
        
        <div class="question">
        من ازت حامله هستم
        </div>
        
        <div class="button-container">
            <button class="choice-button no" onclick="handleChoice('no')">
              نه
            </button>
            
            <button class="choice-button yes" onclick="handleChoice('yes')">
             ارع
            </button>
        </div>
        
        <div id="result" class="result">
            <p id="resultText"></p>
        </div>
    </div>

    <script>
        function handleChoice(choice) {
            const resultDiv = document.getElementById('result');
            const resultText = document.getElementById('resultText');
            
            if (choice === 'no') {
                resultText.textContent = 'پاسخ شما:میگیری منو';
                resultDiv.style.background = '#ffe0e0';
                resultDiv.style.color = '#d63031';
            } else {
                resultText.textContent = 'پاسخ شما: من ازت حاملم باید منو بگیری';
                resultDiv.style.background = '#e0ffe0';
                resultDiv.style.color = '#00b894';
            }
            
            resultDiv.classList.add('show');
        }
    </script>
</body>
</html>
